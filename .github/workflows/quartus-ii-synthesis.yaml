name: Quartus II Compilation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.svg'
      - '**.gif'
      - '**.webp'
      - '**.mp4'
      - '**.zip'
      - '**.pdf'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'scripts/flash.sh'
      - 'scripts/test_one.sh'
      - 'scripts/wave_view.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.svg'
      - '**.gif'
      - '**.webp'
      - '**.mp4'
      - '**.zip'
      - '**.pdf'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'scripts/flash.sh'
      - 'scripts/test_one.sh'
      - 'scripts/wave_view.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run testbenches
        run: ./scripts/test_all.sh

  synthesis:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup and Synthesis
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            raetro/quartus:13.0sp1 \
            bash ./scripts/compile.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts.zip
          path: |
            db/
            compile/
            logs/
          if-no-files-found: ignore